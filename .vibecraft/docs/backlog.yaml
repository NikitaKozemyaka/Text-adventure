version: 1
tasks:
  - title: Визуальная заглушка игрового экрана
    description: >-
      Создать главный экран игры «Тёмные развилки» со статическими
      данными-заглушками в тёмной фэнтезийной стилистике.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Показать заголовок игры, карточку с первым фрагментом истории и набор
      вариантов продолжения. Реализовать только то, что пользователь увидит
      сразу при открытии приложения; навигацию по веткам пока не делать.
    acceptance_criteria:
      - Главный экран отображается без ошибок
      - На экране видны заголовок, текст первого фрагмента и варианты выбора
      - Интерфейс выполнен в тёмной фэнтезийной стилистике с акцентным светлым
        текстом
    id: task-5248
    status: completed
    summary: >-
      Создан главный экран игры «Тёмные развилки» в тёмной фэнтезийной
      стилистике с янтарно-золотистым акцентом. На странице отображаются
      заголовок, карточка с первым фрагментом истории и три варианта выбора.
      Основная реализация — app/page.tsx; название продукта обновлено в
      app/layout.tsx.
  - title: История с развилками
    description:
      "Реализовать переходы между фрагментами истории: выбор одного из
      доступных вариантов открывает соответствующий фрагмент. У каждого
      фрагмента от 2 до 4 вариантов, каждый ведёт к своему продолжению. Разные
      выборы приводят к разным частям сюжета."
    acceptance_criteria:
      - После клика по варианту отображается новый фрагмент, соответствующий
        выбранной ветке
      - У каждого фрагмента есть от 2 до 4 осмысленных вариантов действий
      - Разные выборы приводят к разным фрагментам истории
    id: task-0785
    status: completed
    summary: >-
      Реализованы переходы между фрагментами истории: клик по варианту открывает
      соответствующий фрагмент, у каждого фрагмента от 2 до 4 осмысленных
      вариантов, разные выборы ведут в разные ветки сюжета. Данные — граф
      фрагментов в lib/data.ts; интерактивность — клиентский компонент
      components/story-player.tsx; точка входа — app/page.tsx.
  - title: Финалы и переигровка
    description: "Добавить завершения сюжетных веток: по достижении финала
      отображается итоговый текст концовки и история не продолжается. После
      финала доступна кнопка начала игры заново с самого первого фрагмента."
    acceptance_criteria:
      - По достижении финала отображается итоговый текст концовки
      - После финала история не предлагает новых вариантов
      - Доступна кнопка начала игры заново, возвращающая к первому фрагменту
    id: task-7866
    status: completed
    summary: >-
      Добавлены завершения сюжетных веток: узлы-точки схождения duel, fortress и
      dawn преобразованы в финалы, добавлены новые концовки «Хозяин болот»,
      «Страж Даргвара» и «Изгнание». Фрагмент без вариантов считается финалом:
      показывается итоговый текст концовки и кнопка «Начать заново», после финала
      история не предлагает новых вариантов и возвращает к прологу. Основная
      реализация — lib/data.ts (граф с финалами) и components/story-player.tsx
      (рендер финала и перезапуск).
